<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">STM32 多功能小仪表</title>
<desc id="desc">深色电子仪表主题横幅，展示气泡水平仪、温湿度与红蓝状态灯。</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#102d44"/></linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b2231"/><stop offset="1" stop-color="#102f40"/></linearGradient>
  <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7de8da"/><stop offset="1" stop-color="#1ea6bb"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#a8d8e5" stroke-opacity=".045"/></pattern>
</defs>
<rect width="1200" height="360" rx="28" fill="url(#bg)"/>
<rect width="1200" height="360" rx="28" fill="url(#grid)"/>
<circle cx="1070" cy="70" r="170" fill="#0ca7ae" opacity=".08"/>
<path d="M0 292C210 248 338 354 565 306s390-14 635-96v150H0Z" fill="#06111e" opacity=".38"/>
<g font-family="Segoe UI,Microsoft YaHei,sans-serif">
  <text x="66" y="82" fill="#77dfd1" font-size="15" font-weight="700" letter-spacing="4">DESK INSTRUMENT · STM32F103</text>
  <text x="62" y="151" fill="#f2f7fa" font-size="46" font-weight="700">让传感器数据</text>
  <text x="62" y="207" fill="#f2f7fa" font-size="46" font-weight="700">变成看得见的仪表</text>
  <text x="66" y="250" fill="#a9c0cd" font-size="19">倾斜 · 温湿度 · 历史记录 · 红蓝灯效</text>
  <g transform="translate(760 50)">
    <rect x="0" y="0" width="365" height="258" rx="22" fill="#07121c" stroke="#365d70" stroke-width="2"/>
    <rect x="15" y="15" width="335" height="228" rx="13" fill="url(#screen)" stroke="#1e4658"/>
    <text x="35" y="48" fill="#7de8da" font-size="13" letter-spacing="2">LEVEL  /  LIVE</text>
    <text x="255" y="48" fill="#d4e6e9" font-size="13">PITCH</text>
    <text x="255" y="82" fill="#f4f8f8" font-size="25" font-weight="600">+0.24°</text>
    <circle cx="128" cy="137" r="68" fill="#091b28" stroke="#397184" stroke-width="2"/>
    <circle cx="128" cy="137" r="50" fill="none" stroke="#294b5b" stroke-width="1" stroke-dasharray="3 6"/>
    <path d="M120 137h16M128 129v16" stroke="#75cabd" stroke-opacity=".8"/>
    <circle cx="139" cy="128" r="12" fill="url(#aqua)" filter="url(#glow)"/>
    <text x="255" y="131" fill="#91aebb" font-size="12" letter-spacing="1">CLIMATE</text>
    <text x="255" y="155" fill="#e9f2f3" font-size="17">24.6°C</text>
    <text x="255" y="181" fill="#e9f2f3" font-size="17">48% RH</text>
    <path d="M35 201h290" stroke="#234552"/>
    <text x="35" y="224" fill="#8cb2bd" font-size="11" letter-spacing="1.5">STM32  ·  OLED 128×64</text>
    <circle cx="338" cy="121" r="5" fill="#f04b61" filter="url(#glow)"/>
    <circle cx="338" cy="141" r="5" fill="#378bff" filter="url(#glow)"/>
  </g>
  <text x="66" y="324" fill="#63899a" font-size="12" letter-spacing="2">OPEN HARDWARE PROJECT  /  2026</text>
</g>
</svg>